name: JKT48 Oshi Schedule Checker

on:
  schedule:
    # Berjalan otomatis setiap 3 jam sekali (Format UTC Cron)
    - cron: '0 */3 * * *'
  workflow_dispatch:

# Memberikan izin ke GitHub Actions untuk menulis/push file
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Schedule Check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Save & Commit Sent Shows State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f sent_shows.json ]; then
            git add sent_shows.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent_shows.json [skip ci]" && git push)
          fi
